# Release workflow. No long-lived tokens anywhere: both registries trust this
# repository's GitHub Actions identity (OIDC "trusted publishing").
#
#   PyPI : add a Trusted Publisher on pypi.org → project windsock-mcp,
#          owner team-windsock, repo windsock-mcp, workflow publish.yml, env pypi
#   npm  : after the first publish, enable Trusted Publishing on the package
#          settings page → GitHub Actions, team-windsock/windsock-mcp, publish.yml
#
# Trigger: push a tag `py-vX.Y.Z` to release the Python package, `npm-vX.Y.Z`
# for the npm package. Versions in pyproject.toml / package.json must match.
name: publish

on:
  push:
    tags:
      - "py-v*"
      - "npm-v*"

permissions:
  contents: read

jobs:
  pypi:
    if: startsWith(github.ref_name, 'py-v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check tag matches pyproject version
        run: |
          v=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          [ "py-v$v" = "${{ github.ref_name }}" ] || { echo "tag ${{ github.ref_name }} != py-v$v"; exit 1; }
      - run: python -m pip install --upgrade build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist

  npm:
    if: startsWith(github.ref_name, 'npm-v')
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Check tag matches package.json version
        run: |
          v=$(node -p "require('./package.json').version")
          [ "npm-v$v" = "${{ github.ref_name }}" ] || { echo "tag ${{ github.ref_name }} != npm-v$v"; exit 1; }
      - run: npm install -g npm@latest
      - run: npm install --no-audit --no-fund
      - run: npm publish --provenance --access public
